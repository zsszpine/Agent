<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant</title>
  <style>
    :root {
      --bg: #ffffff;
      --sidebar: #f7f7f8;
      --sidebar-hover: #ececef;
      --surface: #ffffff;
      --surface-soft: #f4f4f4;
      --border: #d9d9e3;
      --border-strong: #c5c5d2;
      --text: #0d0d0d;
      --muted: #6b6b6b;
      --muted-2: #8f8f8f;
      --accent: #111111;
      --blue: #0b7cff;
      --danger: #c12a2a;
      --success: #12805c;
      --shadow: 0 14px 38px rgba(0, 0, 0, 0.12);
      --radius: 8px;
      --sidebar-width: 292px;
      --content-width: 820px;
    }

    [data-theme="dark"] {
      --bg: #212121;
      --sidebar: #171717;
      --sidebar-hover: #2f2f2f;
      --surface: #212121;
      --surface-soft: #2f2f2f;
      --border: #424242;
      --border-strong: #565656;
      --text: #f5f5f5;
      --muted: #c5c5c5;
      --muted-2: #9b9b9b;
      --accent: #f5f5f5;
      --shadow: 0 14px 38px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      background: var(--bg);
    }

    .sidebar {
      min-width: 0;
      height: 100vh;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--sidebar);
      border-right: 1px solid rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    .side-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 0 4px;
    }

    .mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      font-weight: 750;
      letter-spacing: 0;
      background: var(--surface);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: var(--radius);
      color: var(--text);
      font-size: 20px;
      line-height: 1;
    }

    .icon-btn:hover,
    .nav-item:hover,
    .history-item:hover,
    .chip-btn:hover {
      background: var(--sidebar-hover);
    }

    .nav {
      display: grid;
      gap: 4px;
    }

    .nav-item,
    .history-item {
      width: 100%;
      min-height: 44px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: var(--radius);
      text-align: left;
      color: var(--text);
      font-size: 15px;
    }

    .nav-item.active,
    .history-item.active {
      background: #e9e9eb;
    }

    [data-theme="dark"] .nav-item.active,
    [data-theme="dark"] .history-item.active {
      background: #303030;
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 20px;
      line-height: 1;
    }

    .side-section {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      padding: 0 10px;
      color: var(--muted-2);
      font-size: 13px;
    }

    .history {
      display: grid;
      gap: 2px;
      overflow: auto;
      padding-right: 2px;
    }

    .history-item {
      min-height: 36px;
      font-size: 14px;
      padding: 0 6px 0 10px;
      gap: 6px;
    }

    .history-title {
      min-width: 0;
      flex: 1;
      align-self: stretch;
      display: flex;
      align-items: center;
      color: inherit;
      font-size: inherit;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-delete {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      display: inline-grid;
      place-items: center;
      border-radius: var(--radius);
      color: var(--muted-2);
      font-size: 16px;
      line-height: 1;
      opacity: 0;
    }

    .history-item:hover .history-delete,
    .history-delete:focus-visible {
      opacity: 1;
    }

    .history-delete:hover {
      background: var(--surface-soft);
      color: var(--danger);
    }

    .side-spacer {
      flex: 1;
      min-height: 0;
    }

    .side-footer {
      display: grid;
      gap: 6px;
      padding: 8px 0 2px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] .side-footer {
      border-top-color: rgba(255, 255, 255, 0.08);
    }

    .main {
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .topbar {
      height: 58px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .model-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .model-title span {
      color: var(--muted);
      font-size: 18px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted-2);
    }

    .status-dot.ok {
      background: var(--success);
    }

    .status-dot.error {
      background: var(--danger);
    }

    .chat-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .conversation {
      width: min(100%, var(--content-width));
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .messages {
      flex: 1;
      min-height: 0;
      padding: 14px 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .welcome {
      flex: 1;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      text-align: center;
      padding-bottom: 70px;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 42px);
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: 0;
    }

    .prompt-suggestions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .chip-btn {
      min-height: 42px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot,
    .message.error {
      justify-content: flex-start;
    }

    .bubble {
      max-width: min(690px, 88%);
      padding: 0;
      line-height: 1.75;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      max-width: min(590px, 82%);
      padding: 10px 16px;
      border-radius: 22px;
      background: var(--surface-soft);
    }

    .message.error .bubble {
      color: var(--danger);
    }

    .assistant-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      max-width: min(720px, 92%);
    }

    .avatar {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      font-size: 13px;
      font-weight: 750;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      height: 24px;
      align-items: center;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes pulse {
      0%, 80%, 100% {
        transform: scale(0.72);
        opacity: 0.45;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .composer-wrap {
      flex-shrink: 0;
      padding: 0 18px 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0), var(--bg) 22%);
    }

    [data-theme="dark"] .composer-wrap {
      background: linear-gradient(180deg, rgba(33, 33, 33, 0), var(--bg) 22%);
    }

    .selected-files {
      width: min(100%, var(--content-width));
      margin: 0 auto 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .file-chip {
      max-width: 240px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .file-chip.invalid {
      border-color: var(--danger);
      color: var(--danger);
    }

    .file-chip-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-remove {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      border-radius: 50%;
      color: var(--muted);
      line-height: 18px;
      text-align: center;
    }

    .file-remove:hover {
      background: var(--surface-soft);
      color: var(--text);
    }

    .composer {
      width: min(100%, var(--content-width));
      margin: 0 auto;
      min-height: 116px;
      padding: 14px 16px 12px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 170px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 8px 12px;
      color: var(--text);
      background: transparent;
      font-size: 16px;
      line-height: 1.55;
    }

    textarea::placeholder {
      color: var(--muted-2);
    }

    .composer-actions {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px;
    }

    .left-tools,
    .right-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .round-btn {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      color: var(--text);
      font-size: 21px;
      line-height: 1;
    }

    .round-btn:hover {
      background: var(--surface-soft);
    }

    .send-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg);
      font-size: 19px;
      line-height: 1;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .send-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .send-btn:not(:disabled):hover {
      transform: translateY(-1px);
    }

    .mode-pill {
      height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--blue);
      font-size: 14px;
    }

    .mode-pill:hover {
      border-color: var(--border);
      background: var(--surface-soft);
    }

    .hint-row {
      width: min(100%, var(--content-width));
      margin: 8px auto 0;
      display: flex;
      justify-content: center;
      gap: 14px;
      color: var(--muted-2);
      font-size: 12px;
    }

    .knowledge-list,
    .log-list {
      max-height: 180px;
      overflow: auto;
      display: grid;
      gap: 4px;
      padding: 0 2px;
    }

    .knowledge-item,
    .log-item {
      padding: 7px 10px;
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .knowledge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .knowledge-name {
      min-width: 0;
    }

    .knowledge-delete {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      display: inline-grid;
      place-items: center;
      border-radius: var(--radius);
      color: var(--danger);
      font-size: 14px;
    }

    .knowledge-delete:hover {
      background: var(--surface-soft);
    }

    .knowledge-item:hover,
    .log-item:hover {
      background: var(--sidebar-hover);
    }

    .side-mini {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .hidden-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(420px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: 13px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-menu {
      display: none;
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100vh;
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(84vw, var(--sidebar-width));
        z-index: 20;
        transform: translateX(-100%);
        transition: transform 0.18s ease;
        box-shadow: var(--shadow);
      }

      .app.sidebar-open .sidebar {
        transform: translateX(0);
      }

      .mobile-menu {
        display: inline-grid;
      }

      .topbar {
        padding: 0 12px;
      }

      .model-title {
        font-size: 18px;
      }

      .messages {
        padding-inline: 14px;
      }

      .composer-wrap {
        padding-inline: 10px;
      }

      .composer {
        border-radius: 24px;
      }

      .welcome h1 {
        font-size: 30px;
      }

      .prompt-suggestions {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="side-top">
        <div class="mark">AI</div>
        <button class="icon-btn" id="collapseBtn" title="收起侧栏">▱</button>
      </div>

      <nav class="nav">
        <button class="nav-item" id="newChatBtn">
          <span class="nav-icon">✎</span>
          <span>新聊天</span>
        </button>
        <button class="nav-item" id="searchBtn">
          <span class="nav-icon">⌕</span>
          <span>搜索聊天</span>
        </button>
        <button class="nav-item" id="uploadBtn">
          <span class="nav-icon">＋</span>
          <span>上传入库</span>
        </button>
        <button class="nav-item" id="rebuildBtn">
          <span class="nav-icon">↻</span>
          <span>重建索引</span>
        </button>
      </nav>

      <div class="side-section">
        <div class="section-label">Sessions</div>
        <div class="history" id="sessions"></div>
      </div>

      <div class="side-section">
        <div class="side-mini">
          <span>知识库 <strong id="fileCount">0</strong></span>
          <button class="icon-btn" id="knowledgeRefreshBtn" title="刷新知识库">↻</button>
        </div>
        <div class="knowledge-list" id="knowledgeList"></div>
      </div>

      <div class="side-spacer"></div>

      <div class="side-footer">
        <button class="nav-item" id="themeBtn">
          <span class="nav-icon">◐</span>
          <span>切换主题</span>
        </button>
        <button class="nav-item" id="refreshBtn">
          <span class="nav-icon"><span class="status-dot" id="statusPill"></span></span>
          <span>服务状态</span>
        </button>
        <button class="nav-item" id="clearBtn">
          <span class="nav-icon">⌫</span>
          <span>清空会话</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-actions">
          <button class="icon-btn mobile-menu" id="mobileMenuBtn" title="打开侧栏">☰</button>
          <div class="model-title">ChatGPT <span>⌄</span></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="copyBtn" title="复制会话">⧉</button>
          <button class="icon-btn" id="exportBtn" title="导出会话">⇩</button>
        </div>
      </header>

      <section class="chat-shell">
        <div class="conversation">
          <div class="messages" id="messages"></div>

          <footer class="composer-wrap">
            <div class="selected-files" id="selectedFiles"></div>
            <div class="composer">
              <textarea id="question" rows="1" placeholder="有问题，尽管问"></textarea>
              <div class="composer-actions">
                <div class="left-tools">
                  <button class="round-btn" id="attachBtn" title="添加文件">＋</button>
                  <button class="mode-pill" id="deepBtn" title="高级模式">◎ 进阶 ⌄</button>
                </div>
                <div class="right-tools">
                  <button class="round-btn" id="voiceBtn" title="语音输入">♩</button>
                  <button class="send-btn" id="sendBtn" title="发送">↑</button>
                </div>
              </div>
            </div>
            <div class="hint-row">
              <span id="charCount">0 字</span>
              <span id="latency">待命</span>
              <span id="messageCount">0 条消息</span>
            </div>
          </footer>
        </div>
      </section>
    </main>

    <input class="hidden-input" id="fileInput" type="file" multiple accept=".txt,.pdf,.md,.csv,.docx" />
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = {
      chat: '/chat',
      upload: '/upload',
      health: '/health',
      files: '/knowledge/files',
      deleteFile: '/knowledge/files',
      rebuild: '/knowledge/rebuild'
    };

    const SESSION_STORAGE_KEY = 'agent_sessions';
    const CURRENT_SESSION_KEY = 'agent_current_session_id';
    const ALLOWED_UPLOAD_SUFFIXES = ['.txt', '.pdf', '.md', '.csv', '.docx'];

    function createSession(messages = []) {
      return {
        id: `web-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title: 'New chat',
        messages,
        updatedAt: Date.now()
      };
    }

    function loadSessions() {
      try {
        const sessions = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || '[]');
        return Array.isArray(sessions) ? sessions.filter((item) => item && item.id) : [];
      } catch (error) {
        return [];
      }
    }

    const savedSessions = loadSessions();
    const savedSessionId = localStorage.getItem(CURRENT_SESSION_KEY) || localStorage.getItem('agent_thread_id');
    const initialSession = savedSessions.find((item) => item.id === savedSessionId) || savedSessions[0] || createSession();

    const state = {
      threadId: initialSession.id,
      messages: initialSession.messages || [],
      sessions: savedSessions.length ? savedSessions : [initialSession],
      files: [],
      logs: [],
      uploadAfterSelection: false
    };

    localStorage.setItem('agent_thread_id', state.threadId);

    const $ = (selector) => document.querySelector(selector);
    const appEl = $('#app');
    const statusPill = $('#statusPill');
    const messagesEl = $('#messages');
    const questionEl = $('#question');
    const sendBtn = $('#sendBtn');
    const fileInput = $('#fileInput');
    const selectedFilesEl = $('#selectedFiles');
    const knowledgeListEl = $('#knowledgeList');
    const sessionsEl = $('#sessions');
    const toastEl = $('#toast');

    function nowTime() {
      return new Date().toLocaleTimeString('zh-CN', { hour12: false });
    }

    function addLog(text) {
      state.logs.unshift(`[${nowTime()}] ${text}`);
      state.logs = state.logs.slice(0, 18);
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function getCurrentSession() {
      return state.sessions.find((session) => session.id === state.threadId);
    }

    function getSessionTitle(messages) {
      const firstUserMessage = messages.find((item) => item.role === 'user' && !item.error && !item.typing);
      if (!firstUserMessage) return 'New chat';
      return firstUserMessage.content.trim().replace(/\s+/g, ' ').slice(0, 28) || 'New chat';
    }

    function saveCurrentSession() {
      let session = getCurrentSession();
      if (!session) {
        session = createSession();
        session.id = state.threadId;
        state.sessions.unshift(session);
      }

      session.messages = state.messages.filter((item) => !item.typing);
      session.title = getSessionTitle(session.messages);
      session.updatedAt = Date.now();
      state.sessions = state.sessions
        .filter((item) => item.messages.length || item.id === state.threadId)
        .sort((left, right) => right.updatedAt - left.updatedAt)
        .slice(0, 30);

      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(state.sessions));
      localStorage.setItem(CURRENT_SESSION_KEY, state.threadId);
      localStorage.setItem('agent_thread_id', state.threadId);
    }

    function persistSessions() {
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(state.sessions));
      localStorage.setItem(CURRENT_SESSION_KEY, state.threadId);
      localStorage.setItem('agent_thread_id', state.threadId);
    }

    function renderSessions() {
      sessionsEl.innerHTML = '';

      for (const session of state.sessions) {
        const item = document.createElement('div');
        item.className = `history-item${session.id === state.threadId ? ' active' : ''}`;

        const title = document.createElement('button');
        title.className = 'history-title';
        title.type = 'button';
        title.textContent = session.title || 'New chat';
        title.title = session.title || 'New chat';
        title.addEventListener('click', () => switchSession(session.id));

        const remove = document.createElement('button');
        remove.className = 'history-delete';
        remove.type = 'button';
        remove.title = `Delete ${session.title || 'New chat'}`;
        remove.textContent = 'x';
        remove.addEventListener('click', (event) => {
          event.stopPropagation();
          deleteSession(session.id);
        });

        item.append(title, remove);
        sessionsEl.appendChild(item);
      }
    }

    function switchSession(sessionId) {
      const targetSession = state.sessions.find((item) => item.id === sessionId);
      if (!targetSession) return;

      saveCurrentSession();
      if (!state.sessions.some((item) => item.id === targetSession.id)) {
        state.sessions.unshift(targetSession);
      }

      state.threadId = targetSession.id;
      state.messages = targetSession.messages || [];
      state.sessions = state.sessions.filter((item) => item.messages.length || item.id === state.threadId);
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(state.sessions));
      localStorage.setItem(CURRENT_SESSION_KEY, state.threadId);
      localStorage.setItem('agent_thread_id', state.threadId);
      renderMessages();
      renderSessions();
      appEl.classList.remove('sidebar-open');
      questionEl.focus();
    }

    function deleteSession(sessionId) {
      const targetSession = state.sessions.find((item) => item.id === sessionId);
      if (!targetSession) return;

      if (!window.confirm(`Delete chat "${targetSession.title || 'New chat'}"?`)) return;

      if (sessionId !== state.threadId) {
        saveCurrentSession();
      }

      state.sessions = state.sessions.filter((item) => item.id !== sessionId);

      if (sessionId === state.threadId) {
        const nextSession = state.sessions[0] || createSession();
        if (!state.sessions.length) {
          state.sessions = [nextSession];
        }
        state.threadId = nextSession.id;
        state.messages = nextSession.messages || [];
      }

      persistSessions();
      renderMessages();
      renderSessions();
      appEl.classList.remove('sidebar-open');
      addLog('Deleted chat');
      showToast('Chat deleted');
      questionEl.focus();
    }

    function startNewSession() {
      saveCurrentSession();
      const blankSession = state.sessions.find((item) => !item.messages.length);
      if (blankSession) {
        switchSession(blankSession.id);
        return;
      }

      const session = createSession();
      state.sessions.unshift(session);
      state.threadId = session.id;
      state.messages = [];
      saveCurrentSession();
      renderMessages();
      renderSessions();
      appEl.classList.remove('sidebar-open');
      questionEl.focus();
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.detail || data.message || `HTTP ${response.status}`);
      }
      return data;
    }

    function addMessage(role, content, options = {}) {
      const message = {
        role,
        content,
        time: nowTime(),
        typing: Boolean(options.typing),
        error: Boolean(options.error)
      };
      state.messages.push(message);
      renderMessages();
      saveCurrentSession();
      renderSessions();
      return message;
    }

    function renderWelcome() {
      const welcome = document.createElement('div');
      welcome.className = 'welcome';

      const title = document.createElement('h1');
      title.textContent = '我们先从哪里开始呢？';

      const suggestions = document.createElement('div');
      suggestions.className = 'prompt-suggestions';
      const items = [
        ['▧', '总结资料'],
        ['✎', '撰写或编辑'],
        ['⌕', '查找知识库']
      ];

      for (const [icon, label] of items) {
        const button = document.createElement('button');
        button.className = 'chip-btn';
        button.type = 'button';
        button.textContent = `${icon} ${label}`;
        button.addEventListener('click', () => {
          questionEl.value = label === '总结资料' ? '请总结我上传的知识库资料' : label === '撰写或编辑' ? '帮我写一份结构清晰的说明文档' : '请列出当前知识库文件并说明可以查询什么';
          autoResize();
          questionEl.focus();
        });
        suggestions.appendChild(button);
      }

      welcome.append(title, suggestions);
      messagesEl.appendChild(welcome);
    }

    function renderMessages() {
      messagesEl.innerHTML = '';

      if (!state.messages.length) {
        renderWelcome();
        $('#messageCount').textContent = '0 条消息';
        return;
      }

      for (const item of state.messages) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${item.error ? 'error' : item.role}`;

        if (item.role === 'user' && !item.error) {
          const bubble = document.createElement('div');
          bubble.className = 'bubble';
          bubble.textContent = item.content;
          wrapper.appendChild(bubble);
        } else {
          const row = document.createElement('div');
          row.className = 'assistant-row';
          const avatar = document.createElement('div');
          avatar.className = 'avatar';
          avatar.textContent = item.error ? '!' : 'AI';
          const bubble = document.createElement('div');
          bubble.className = 'bubble';

          if (item.typing) {
            bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
          } else {
            bubble.textContent = item.content;
          }

          row.append(avatar, bubble);
          wrapper.appendChild(row);
        }

        messagesEl.appendChild(wrapper);
      }

      $('#messageCount').textContent = `${state.messages.length} 条消息`;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderSelectedFiles() {
      const files = Array.from(fileInput.files || []);
      selectedFilesEl.innerHTML = '';

      for (const [index, file] of files.entries()) {
        const chip = document.createElement('div');
        chip.className = `file-chip${isAllowedUploadFile(file) ? '' : ' invalid'}`;
        chip.textContent = `${file.name} · ${(file.size / 1024).toFixed(1)} KB`;
        const displayText = chip.textContent;
        chip.textContent = '';

        const name = document.createElement('span');
        name.className = 'file-chip-name';
        name.textContent = displayText;
        if (!isAllowedUploadFile(file)) {
          name.title = `Unsupported file type: ${getFileSuffix(file.name) || 'no extension'}`;
        }

        const remove = document.createElement('button');
        remove.className = 'file-remove';
        remove.type = 'button';
        remove.title = `Remove ${file.name}`;
        remove.textContent = 'x';
        remove.addEventListener('click', () => removeSelectedFile(index));

        chip.append(name, remove);
        selectedFilesEl.appendChild(chip);
      }
    }

    function getFileSuffix(filename) {
      const dotIndex = filename.lastIndexOf('.');
      return dotIndex >= 0 ? filename.slice(dotIndex).toLowerCase() : '';
    }

    function isAllowedUploadFile(file) {
      return ALLOWED_UPLOAD_SUFFIXES.includes(getFileSuffix(file.name));
    }

    function getInvalidUploadFiles(files) {
      return files.filter((file) => !isAllowedUploadFile(file));
    }

    function setSelectedFiles(files) {
      const dataTransfer = new DataTransfer();
      for (const file of files) {
        dataTransfer.items.add(file);
      }
      fileInput.files = dataTransfer.files;
      renderSelectedFiles();
    }

    function removeSelectedFile(indexToRemove) {
      const files = Array.from(fileInput.files || []);
      setSelectedFiles(files.filter((_, index) => index !== indexToRemove));
    }

    function renderKnowledgeFiles() {
      knowledgeListEl.innerHTML = '';
      $('#fileCount').textContent = String(state.files.length);

      if (!state.files.length) {
        const empty = document.createElement('div');
        empty.className = 'knowledge-item';
        empty.textContent = '暂无文件';
        knowledgeListEl.appendChild(empty);
        return;
      }

      for (const file of state.files.slice(0, 12)) {
        const item = document.createElement('div');
        item.className = 'knowledge-item';
        item.textContent = `${file.path} · ${(file.size / 1024).toFixed(1)} KB`;
        if (isUploadedKnowledgeFile(file)) {
          const remove = document.createElement('button');
          remove.className = 'knowledge-delete';
          remove.type = 'button';
          remove.title = `Delete ${file.path}`;
          remove.textContent = 'x';
          remove.addEventListener('click', () => deleteKnowledgeFile(file));
          item.appendChild(remove);
        }
        knowledgeListEl.appendChild(item);
      }
    }

    function isUploadedKnowledgeFile(file) {
      return file.path.replace(/\\/g, '/').startsWith('uploads/');
    }

    function autoResize() {
      questionEl.style.height = '42px';
      questionEl.style.height = `${Math.min(questionEl.scrollHeight, 170)}px`;
      $('#charCount').textContent = `${questionEl.value.length} 字`;
    }

    async function refreshHealth() {
      try {
        const data = await fetchJson(API.health);
        statusPill.className = 'status-dot ok';
        addLog(`服务正常，知识文件 ${data.knowledge_files} 个`);
        showToast('服务在线');
      } catch (error) {
        statusPill.className = 'status-dot error';
        addLog(`服务异常：${error.message}`);
        showToast(`服务异常：${error.message}`);
      }
    }

    async function refreshKnowledgeFiles() {
      try {
        const data = await fetchJson(API.files);
        state.files = data.files || [];
        renderKnowledgeFiles();
      } catch (error) {
        addLog(`知识库刷新失败：${error.message}`);
      }
    }

    async function deleteKnowledgeFile(file) {
      if (!window.confirm(`Delete uploaded file "${file.path}"?`)) return;

      try {
        const data = await fetchJson(API.deleteFile, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: file.path })
        });
        state.files = data.files || [];
        renderKnowledgeFiles();
        await refreshHealth();
        showToast(data.message || 'File deleted');
        addLog(`Deleted uploaded file: ${file.path}`);
      } catch (error) {
        showToast(error.message);
        addLog(`Delete uploaded file failed: ${error.message}`);
      }
    }

    async function sendQuestion() {
      const question = questionEl.value.trim();
      if (!question) return;

      addMessage('user', question);
      questionEl.value = '';
      autoResize();

      const typing = addMessage('bot', '', { typing: true });
      const startedAt = performance.now();
      sendBtn.disabled = true;
      $('#latency').textContent = '生成中';

      try {
        const data = await fetchJson(API.chat, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question, thread_id: state.threadId })
        });

        typing.typing = false;
        typing.content = data.reply || '后端没有返回回答。';
        renderMessages();
        saveCurrentSession();
        renderSessions();
        $('#latency').textContent = `${Math.round(performance.now() - startedAt)} ms`;
        addLog('聊天完成');
      } catch (error) {
        state.messages = state.messages.filter((item) => item !== typing);
        addMessage('bot', error.message, { error: true });
        $('#latency').textContent = '失败';
        addLog(`聊天失败：${error.message}`);
      } finally {
        sendBtn.disabled = false;
        questionEl.focus();
      }
    }

    async function uploadFiles() {
      const files = Array.from(fileInput.files || []);
      if (!files.length) {
        state.uploadAfterSelection = true;
        fileInput.click();
        return;
      }

      const invalidFiles = getInvalidUploadFiles(files);
      if (invalidFiles.length) {
        renderSelectedFiles();
        showToast(`Unsupported file type: ${invalidFiles.map((file) => getFileSuffix(file.name) || 'no extension').join(', ')}`);
        addLog(`Upload canceled, unsupported files: ${invalidFiles.map((file) => file.name).join(', ')}`);
        return;
      }

      const formData = new FormData();
      for (const file of files) {
        formData.append('files', file);
      }

      $('#uploadBtn').disabled = true;
      addLog(`开始上传 ${files.length} 个文件`);

      try {
        const data = await fetchJson(API.upload, {
          method: 'POST',
          body: formData
        });
        showToast(data.message || '上传完成');
        fileInput.value = '';
        renderSelectedFiles();
        await refreshKnowledgeFiles();
        await refreshHealth();
      } catch (error) {
        showToast(error.message);
        addLog(`上传失败：${error.message}`);
      } finally {
        $('#uploadBtn').disabled = false;
      }
    }

    async function rebuildKnowledge() {
      $('#rebuildBtn').disabled = true;
      addLog('开始重建知识库');

      try {
        const data = await fetchJson(API.rebuild, { method: 'POST' });
        showToast(data.message || '重建完成');
        await refreshKnowledgeFiles();
        await refreshHealth();
      } catch (error) {
        showToast(error.message);
        addLog(`重建失败：${error.message}`);
      } finally {
        $('#rebuildBtn').disabled = false;
      }
    }

    function conversationText() {
      return state.messages
        .filter((item) => !item.typing)
        .map((item) => `${item.role === 'user' ? '用户' : item.error ? '系统' : '助手'}：${item.content}`)
        .join('\n\n');
    }

    async function copyConversation() {
      const text = conversationText();
      await navigator.clipboard.writeText(text);
      showToast('已复制');
    }

    function exportConversation() {
      const blob = new Blob([conversationText()], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `agent-chat-${Date.now()}.txt`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function clearConversation() {
      state.messages = [];
      renderMessages();
      saveCurrentSession();
      renderSessions();
      addLog('会话已清空');
    }

    function toggleTheme() {
      const nextTheme = document.body.dataset.theme === 'dark' ? '' : 'dark';
      document.body.dataset.theme = nextTheme;
      localStorage.setItem('agent_theme', nextTheme);
    }

    sendBtn.addEventListener('click', sendQuestion);
    questionEl.addEventListener('input', autoResize);
    questionEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendQuestion();
      }
    });

    fileInput.addEventListener('change', () => {
      renderSelectedFiles();
      if (state.uploadAfterSelection) {
        state.uploadAfterSelection = false;
        if (fileInput.files.length) {
          uploadFiles();
          return;
        }
      }
      if (fileInput.files.length) {
        showToast(`已选择 ${fileInput.files.length} 个文件`);
      }
    });

    $('#attachBtn').addEventListener('click', () => {
      state.uploadAfterSelection = false;
      fileInput.click();
    });
    $('#uploadBtn').addEventListener('click', uploadFiles);
    $('#rebuildBtn').addEventListener('click', rebuildKnowledge);
    $('#refreshBtn').addEventListener('click', refreshHealth);
    $('#knowledgeRefreshBtn').addEventListener('click', refreshKnowledgeFiles);
    $('#copyBtn').addEventListener('click', copyConversation);
    $('#exportBtn').addEventListener('click', exportConversation);
    $('#clearBtn').addEventListener('click', clearConversation);
    $('#newChatBtn').addEventListener('click', startNewSession);
    $('#themeBtn').addEventListener('click', toggleTheme);
    $('#mobileMenuBtn').addEventListener('click', () => appEl.classList.add('sidebar-open'));
    $('#collapseBtn').addEventListener('click', () => appEl.classList.remove('sidebar-open'));
    $('#searchBtn').addEventListener('click', () => {
      questionEl.value = '请帮我搜索当前知识库中与以下主题相关的内容：';
      autoResize();
      questionEl.focus();
    });
    $('#deepBtn').addEventListener('click', () => showToast('进阶模式已启用：可调用工具、知识库和报告能力'));
    $('#voiceBtn').addEventListener('click', () => showToast('当前版本暂未接入语音输入'));

    document.body.dataset.theme = localStorage.getItem('agent_theme') || '';
    renderMessages();
    renderSessions();
    renderSelectedFiles();
    renderKnowledgeFiles();
    autoResize();
    refreshHealth();
    refreshKnowledgeFiles();
  </script>
</body>
</html>
